[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safesort"
version = "0.1.0"
description = "A safe, non-destructive command-line file organizer."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siergej Sobolewski" },
]
keywords = ["cli", "files", "organizer", "duplicates"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
safesort = "safesort.cli:main"

[project.urls]
Repository = "https://github.com/Cartesian-School/safesort"
Issues = "https://github.com/Cartesian-School/safesort/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
